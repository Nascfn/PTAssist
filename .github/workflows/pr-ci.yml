name: PR CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api-lint:
    name: API lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Throwaway test database. Same port and credentials as the local setup in backend/README.md.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ptassist
          POSTGRES_PASSWORD: ptassist
          POSTGRES_DB: ptassist_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ptassist -d ptassist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tests/conftest.py points the app at this database.
      TEST_DATABASE_URL: postgresql+psycopg://ptassist:ptassist@localhost:5433/ptassist_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  api-image:
    name: API image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build API image (no push)
        run: docker build --tag ptassist-api:ci ./backend
